# frontend/nginx/nginx.conf — Безопасная конфигурация Nginx
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ✅ Скрыть версию nginx
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ✅ Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.unsplash.com; connect-src 'self' https://api.marketplace.ru; frame-src 'none'; object-src 'none';" always;

    # ✅ SPA fallback — все маршруты → index.html
    location / {
      try_files $uri $uri/ /index.html;
    }

    # ✅ Статические ассеты — долгосрочное кеширование
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # ✅ Запрет доступа к скрытым файлам
    location ~ /\. {
      deny all;
    }
  }
}